<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やる事">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>やる事カレンダー</title>
<style>
  /* 上：月のカレンダー / 下：選んだ日の予定とやる事。1カラム、スマホ幅基準 */
  :root {
    --bg: #f6f6f3;
    --card: #ffffff;
    --text: #1f1f1d;
    --sub: #8a8a84;
    --line: #e6e6e1;
    --accent: #2f6f4f;
    --accent-soft: #e3efe8;
    --danger: #b3412f;
    --sun: #b3412f;
    --sat: #2f5f9f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --card: #222220; --text: #ededea; --sub: #8f8f88; --line: #33332f;
      --accent: #6cbf93; --accent-soft: #23362b; --danger: #e07a68; --sun: #e07a68; --sat: #7ea6e0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --card: #222220; --text: #ededea; --sub: #8f8f88; --line: #33332f;
    --accent: #6cbf93; --accent-soft: #23362b; --danger: #e07a68; --sun: #e07a68; --sat: #7ea6e0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { font-size: 13px; color: var(--sub); margin: 0; }

  /* カレンダー */
  .cal-head { display: flex; align-items: center; gap: 4px; }
  .cal-head h1 { font-size: 24px; margin: 0; flex: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .nav { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; color: var(--sub); }
  .nav:hover { background: var(--card); color: var(--text); }
  .today-btn { font-size: 13px; padding: 7px 12px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); background: var(--card); }
  .grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--line);
    padding: 6px; gap: 2px;
  }
  .dow { text-align: center; font-size: 12px; color: var(--sub); padding: 6px 0 4px; }
  .dow.sun { color: var(--sun); } .dow.sat { color: var(--sat); }
  .day {
    aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 6px; gap: 3px; font-size: 15px; font-variant-numeric: tabular-nums; position: relative;
  }
  .day.other { color: var(--sub); opacity: 0.45; }
  .day.sun .num { color: var(--sun); } .day.sat .num { color: var(--sat); }
  .day:hover { background: var(--bg); }
  .day.today .num { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .day.sel { background: var(--accent-soft); }
  .day.sel .num { color: var(--accent); font-weight: 700; }
  .marks { display: flex; gap: 3px; height: 6px; }
  .mark { width: 6px; height: 6px; border-radius: 50%; }
  .mark.ev { background: var(--accent); }
  .mark.td { box-shadow: inset 0 0 0 1.5px var(--sub); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* 選んだ日 */
  .day-head h2 { font-size: 20px; margin: 0 0 2px; }
  .day-head p { margin: 0; font-size: 14px; color: var(--sub); }
  form { display: flex; flex-direction: column; gap: 8px; }
  .seg { display: inline-flex; background: var(--card); border-radius: 10px; box-shadow: 0 0 0 1px var(--line); padding: 3px; align-self: flex-start; }
  .seg button { font-size: 14px; padding: 6px 14px; border-radius: 8px; color: var(--sub); }
  .seg button.on { background: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"], input[type="time"] {
    font: inherit; font-size: 16px; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--text); outline: none; min-width: 0;
  }
  input[type="text"] { flex: 1 1 200px; }
  input[type="time"] { flex: 0 1 130px; font-variant-numeric: tabular-nums; }
  input:focus { border-color: var(--accent); }
  .times { align-items: center; color: var(--sub); font-size: 14px; }
  .add { background: var(--accent); color: #fff; font-weight: 600; padding: 0 18px; border-radius: 12px; min-height: 44px; }

  section h3 { font-size: 13px; color: var(--sub); font-weight: 600; letter-spacing: 0.06em; margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: none; }
  .time { font-size: 14px; font-weight: 600; color: var(--accent); min-width: 92px; font-variant-numeric: tabular-nums; }
  .check { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check::after {
    content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .text { flex: 1; min-width: 0; font-size: 16px; word-break: break-word; }
  .from { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
  li.done .text { color: var(--sub); text-decoration: line-through; }
  .mini { font-size: 12px; color: var(--sub); padding: 5px 8px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); white-space: nowrap; }
  .mini:hover { color: var(--accent); }
  .del { color: var(--sub); font-size: 20px; line-height: 1; padding: 4px 6px; }
  .del:hover { color: var(--danger); }
  .empty { color: var(--sub); font-size: 14px; margin: 0; padding: 4px 2px; }
  .footer { display: flex; justify-content: flex-end; }
  .clear { font-size: 14px; color: var(--sub); padding: 6px 4px; }
  .clear:hover { color: var(--danger); }
  @media (prefers-reduced-motion: no-preference) { .day, .nav { transition: background .12s; } }
</style>
</head>
<body>

<main>
  <div>
    <div class="cal-head">
      <h1 id="month"></h1>
      <button class="nav" id="prev" aria-label="前の月">‹</button>
      <button class="nav" id="next" aria-label="次の月">›</button>
      <button class="today-btn" id="goToday">今日</button>
    </div>
    <p class="status" id="status" hidden></p>
  </div>

  <div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i class="mark ev"></i>予定あり</span><span><i class="mark td"></i>未完了のやる事</span></div>
  </div>

  <div class="day-head">
    <h2 id="dayTitle"></h2>
    <p id="daySummary"></p>
  </div>

  <form id="form">
    <div class="seg" id="seg">
      <button type="button" data-kind="todo" class="on">やる事</button>
      <button type="button" data-kind="event">予定</button>
    </div>
    <div class="row">
      <input type="text" id="input" placeholder="やる事を入力" autocomplete="off" maxlength="200">
      <button type="submit" class="add">追加</button>
    </div>
    <div class="row times" id="times" hidden>
      <input type="time" id="start" aria-label="開始時刻">
      <span>〜</span>
      <input type="time" id="end" aria-label="終了時刻">
      <span>（空欄なら終日）</span>
    </div>
  </form>

  <section id="carrySec" hidden>
    <h3>持ち越し（前の日の未完了）</h3>
    <ul id="carry"></ul>
  </section>

  <section>
    <h3>スケジュール</h3>
    <ul id="events"></ul>
    <p class="empty" id="eventsEmpty">予定はありません。</p>
  </section>

  <section>
    <h3>やる事</h3>
    <ul id="todos"></ul>
    <p class="empty" id="todosEmpty">やる事はありません。</p>
  </section>

  <div class="footer"><button class="clear" id="clear" hidden>この日の完了したものを削除</button></div>
</main>

<script>
(function () {
  // ---------- 日付ユーティリティ（端末のローカル時刻） ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const label = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };

  let today = ymd(new Date());
  let selected = today;
  let viewY = new Date().getFullYear(), viewM = new Date().getMonth();
  let kind = "todo";
  let items = {}; // id -> {date, kind, text, done, time, end, createdAt}

  // ---------- 保存先：claude.ai 上ではデータベース、それ以外はブラウザ ----------
  const LOCAL_KEY = "planner-items";
  let db = null, col = null;
  const statusEl = document.getElementById("status");
  function setStatus(t) { statusEl.textContent = t || ""; statusEl.hidden = !t; }

  function loadLocal() {
    try {
      const saved = localStorage.getItem(LOCAL_KEY);
      if (saved) return JSON.parse(saved);
      // 以前の「やる事リスト」のデータがあれば今日のやる事として引き継ぐ
      const old = JSON.parse(localStorage.getItem("todo-items") || "[]");
      const out = {};
      for (const t of old) {
        const id = "t" + String(t.id).replace(/[^0-9]/g, "").slice(0, 16) + Math.random().toString(36).slice(2, 6);
        out[id] = { date: today, kind: "todo", text: t.text, done: !!t.done, time: "", end: "", createdAt: Date.now() };
      }
      return out;
    } catch (e) { return {}; }
  }
  function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch (e) {} }

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  async function put(id, data) {
    items[id] = data; render();
    if (col) { try { await col.doc(id).set(data); } catch (e) { setStatus("保存できませんでした。通信状態を確認してもう一度お試しください。"); } }
    else saveLocal();
  }
  async function remove(id) {
    delete items[id]; render();
    if (col) { try { await col.doc(id).delete(); } catch (e) { setStatus("削除できませんでした。もう一度お試しください。"); } }
    else saveLocal();
  }
  const patch = (id, fields) => put(id, Object.assign({}, items[id], fields));

  // ---------- 描画 ----------
  const $ = id => document.getElementById(id);

  function byDate(date) { return Object.entries(items).filter(([, v]) => v.date === date); }

  function renderCalendar() {
    $("month").textContent = `${viewY}年${viewM + 1}月`;
    const grid = $("grid");
    grid.innerHTML = "";
    WD.forEach((w, i) => {
      const el = document.createElement("div");
      el.className = "dow" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
      el.textContent = w;
      grid.appendChild(el);
    });
    // 日付ごとの印を先に集計
    const ev = new Set(), td = new Set();
    for (const v of Object.values(items)) {
      if (v.kind === "event") ev.add(v.date);
      else if (!v.done) td.add(v.date);
    }
    const first = new Date(viewY, viewM, 1);
    const start = new Date(viewY, viewM, 1 - first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(viewY, viewM + 1, 0).getDate()) / 7);
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const s = ymd(d);
      const b = document.createElement("button");
      b.className = "day";
      if (d.getMonth() !== viewM) b.classList.add("other");
      if (d.getDay() === 0) b.classList.add("sun");
      if (d.getDay() === 6) b.classList.add("sat");
      if (s === today) b.classList.add("today");
      if (s === selected) b.classList.add("sel");
      b.setAttribute("aria-label", label(s));
      const num = document.createElement("span"); num.className = "num"; num.textContent = d.getDate();
      const marks = document.createElement("span"); marks.className = "marks";
      if (ev.has(s)) { const m = document.createElement("i"); m.className = "mark ev"; marks.appendChild(m); }
      if (td.has(s)) { const m = document.createElement("i"); m.className = "mark td"; marks.appendChild(m); }
      b.append(num, marks);
      b.onclick = () => { selected = s; if (d.getMonth() !== viewM) { viewY = d.getFullYear(); viewM = d.getMonth(); } render(); };
      grid.appendChild(b);
    }
  }

  function delBtn(id) {
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "削除");
    del.onclick = () => remove(id);
    return del;
  }

  function todoRow(id, t, carried) {
    const li = document.createElement("li");
    if (t.done) li.classList.add("done");
    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-label", t.done ? "未完了に戻す" : "完了にする");
    check.onclick = () => patch(id, { done: !t.done });
    const text = document.createElement("span");
    text.className = "text"; text.textContent = t.text;
    if (carried) { const f = document.createElement("span"); f.className = "from"; f.textContent = label(t.date) + "から"; text.appendChild(f); }
    const move = document.createElement("button");
    move.className = "mini";
    if (carried) { move.textContent = "この日へ"; move.onclick = () => patch(id, { date: selected }); }
    else { move.textContent = "翌日へ"; move.onclick = () => patch(id, { date: addDays(t.date, 1) }); }
    li.append(check, text);
    if (!t.done) li.appendChild(move);
    li.appendChild(delBtn(id));
    return li;
  }

  function renderDay() {
    $("dayTitle").textContent = label(selected) + (selected === today ? " · 今日" : "");
    const list = byDate(selected);
    const events = list.filter(([, v]) => v.kind === "event")
      .sort((a, b) => (a[1].time || "").localeCompare(b[1].time || ""));
    const todos = list.filter(([, v]) => v.kind !== "event")
      .sort((a, b) => (a[1].done - b[1].done) || (b[1].createdAt - a[1].createdAt));
    const left = todos.filter(([, v]) => !v.done).length;
    $("daySummary").textContent = `予定 ${events.length} 件 · やる事 残り ${left} / ${todos.length} 件`;

    const evUl = $("events"); evUl.innerHTML = "";
    for (const [id, e] of events) {
      const li = document.createElement("li");
      const tm = document.createElement("span"); tm.className = "time";
      tm.textContent = e.time ? (e.end ? `${e.time}–${e.end}` : e.time) : "終日";
      const text = document.createElement("span"); text.className = "text"; text.textContent = e.text;
      li.append(tm, text, delBtn(id));
      evUl.appendChild(li);
    }
    evUl.hidden = !events.length; $("eventsEmpty").hidden = !!events.length;

    const tdUl = $("todos"); tdUl.innerHTML = "";
    for (const [id, t] of todos) tdUl.appendChild(todoRow(id, t, false));
    tdUl.hidden = !todos.length; $("todosEmpty").hidden = !!todos.length;

    // 今日を開いているときだけ、過去の未完了を「持ち越し」として出す
    const carry = selected === today
      ? Object.entries(items).filter(([, v]) => v.kind !== "event" && !v.done && v.date < today)
          .sort((a, b) => a[1].date.localeCompare(b[1].date))
      : [];
    const cUl = $("carry"); cUl.innerHTML = "";
    for (const [id, t] of carry) cUl.appendChild(todoRow(id, t, true));
    $("carrySec").hidden = !carry.length;

    $("clear").hidden = !todos.some(([, v]) => v.done);
  }

  function render() { renderCalendar(); renderDay(); }

  // ---------- 操作 ----------
  $("prev").onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); };
  $("next").onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); };
  $("goToday").onclick = () => { today = ymd(new Date()); selected = today; viewY = new Date().getFullYear(); viewM = new Date().getMonth(); render(); };

  $("seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    kind = b.dataset.kind;
    for (const x of $("seg").children) x.classList.toggle("on", x === b);
    $("times").hidden = kind !== "event";
    $("input").placeholder = kind === "event" ? "予定を入力（例：歯医者）" : "やる事を入力";
    $("input").focus();
  });

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    const start = kind === "event" ? $("start").value : "";
    const end = kind === "event" && start ? $("end").value : "";
    put(newId(), { date: selected, kind, text, done: false, time: start, end, createdAt: Date.now() });
    $("input").value = ""; $("start").value = ""; $("end").value = "";
  });

  $("clear").onclick = () => {
    for (const [id, v] of byDate(selected)) if (v.kind !== "event" && v.done) remove(id);
  };

  // 日付が変わったら「今日」を更新
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && ymd(new Date()) !== today) {
      const wasToday = selected === today; today = ymd(new Date()); if (wasToday) selected = today; render();
    }
  });

  // ---------- 起動 ----------
  async function boot() {
    if (!window.claude || typeof window.claude.use !== "function") {
      items = loadLocal(); render(); return;
    }
    render();
    setStatus("読み込み中…");
    db = await window.claude.use("db");
    if (!db) { items = loadLocal(); setStatus("この画面ではデータを同期できないため、この端末にだけ保存します。"); render(); return; }
    col = db.collection("items");
    const timer = setTimeout(() => setStatus("データに接続できていません。表示が古い可能性があります。"), 10000);
    col.onSnapshot(snap => {
      const next = {};
      for (const d of snap.docs) next[d.id] = d.data();
      items = next;
      if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus(""); }
      render();
    }, err => {
      clearTimeout(timer);
      setStatus(err && err.code === "revoked" ? "" : "データを読み込めませんでした。ページを開き直してください。");
    });
  }
  boot();
})();
</script>
</body>
</html>
